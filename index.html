    border-radius: 16px;

  }

    font-size: 0.8rem;
    color: var(--ink-soft);
  }

    color: var(--accent);
    font-size: 0.85rem;
    text-decoration: none;
    white-space: nowrap;
  }

    position: fixed;
    top: 20px;
    right: 28px;
    cursor: pointer;
    font-size: 2rem;
    color: #fff;
    background: none;
    border: none;
    line-height: 1;
    z-index: 51;
  }
  .nav-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 2.5rem;
    color: #fff;
    background: rgba(0, 0, 0, 0.25);
    border: none;
    line-height: 1;
    z-index: 51;
    padding: 12px 16px;
    border-radius: 8px;

const categories = ["그림", "제주"];

const grid = document.getElementById('grid');
const tabsEl = document.getElementById('tabs');
const countEl = document.getElementById('imgCount');
let activeCategory = '전체';
let filteredImages = images;

function renderTabs() {
  const tabs = ['전체', ...categories];
  tabsEl.innerHTML = '';
  tabs.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (cat === activeCategory ? ' active' : '');
    btn.textContent = cat;
    btn.addEventListener('click', () => {
      activeCategory = cat;
      renderTabs();
      renderGrid();
    });
    tabsEl.appendChild(btn);
  });
}

function renderGrid() {
  filteredImages = activeCategory === '전체' ? images : images.filter(img => img.category === activeCategory);
  countEl.textContent = filteredImages.length;
  grid.innerHTML = '';
  filteredImages.forEach((img, idx) => {
    const el = document.createElement('img');
    el.className = 'thumb';
    el.src = img.src;
    el.loading = 'lazy';
    el.alt = img.title;
    el.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(el);
  });
}

renderTabs();
renderGrid();

const overlay = document.getElementById('overlay');
const lightbox = document.getElementById('lightbox');
let currentIdx = -1;

function imgParamId(img) {
  const filename = img.src.split('/').pop();
  return img.logNo + '_' + filename;
}

function openLightbox(idx) {
  currentIdx = idx;
  const img = filteredImages[idx];
  lightbox.innerHTML = `
    <img src="${img.src}" alt="">
    <div class="lightbox-info">
      <div>
        <h3>${img.title}</h3>
        <p>${img.date || ''}</p>
      </div>
      <a href="posts/index.html?id=${img.logNo}">글 보기 →</a>
    </div>
  `;
  overlay.classList.add('open');
  const url = window.location.pathname + '?img=' + encodeURIComponent(imgParamId(img));
  history.replaceState(null, '', url);
}

function showNext() {
  if (currentIdx < 0) return;
  openLightbox((currentIdx + 1) % filteredImages.length);
}

function showPrev() {
  if (currentIdx < 0) return;
  openLightbox((currentIdx - 1 + filteredImages.length) % filteredImages.length);
}

function closeLightbox() {
  overlay.classList.remove('open');
  lightbox.innerHTML = '';
  currentIdx = -1;
  history.replaceState(null, '', window.location.pathname);
}

document.getElementById('closeBtn').addEventListener('click', closeLightbox);
document.getElementById('nextBtn').addEventListener('click', showNext);
document.getElementById('prevBtn').addEventListener('click', showPrev);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') showNext();
  if (e.key === 'ArrowLeft') showPrev();
});

// open directly if URL already has ?img=... on load (no history entry added)
const initialImgParam = new URLSearchParams(window.location.search).get('img');
if (initialImgParam) {
  const fullIdx = images.findIndex(img => imgParamId(img) === initialImgParam);
  if (fullIdx >= 0) {
    activeCategory = '전체';
    renderTabs();
    renderGrid();
    openLightbox(fullIdx);
  }
}
</script>
